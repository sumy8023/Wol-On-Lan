# 代理服务监听地址和端口。
# 配置文件可写成 ":14250" 表示监听本机所有网卡的 14250 端口；Web 页面里的“监听端口”只填写数字 14250。
listen: ":14250"

# APK 连接代理服务时填写的 KEY。
# 请务必改成自己的长随机字符串，不要继续使用示例值。
key: "change-this-key"

# 当 APK 设备里的 IP地址/广播地址为空时，代理服务使用的默认广播地址。
# 一般保持 "255.255.255.255" 即可。
default_broadcast: "255.255.255.255"

# 当 APK 设备里的 UDP 端口为空时，代理服务使用的默认端口。
# WOL 常用端口是 9，也有少数设备使用 7。
default_port: 9

# 同一个 MAC 地址的服务端冷却时间，单位是秒。
# 默认 5 秒内同一个 MAC 只能唤醒一次，防止重复点击或接口被频繁调用。
cooldown_seconds: 5

# MAC 白名单。
# 写成 [] 表示允许 APK 请求唤醒任意 MAC；如果填写列表，则只允许列表里的 MAC 被唤醒。
allow_macs: []

# MAC 白名单写法示例：
# allow_macs:
#   - "AA:BB:CC:DD:EE:FF"
#   - "11:22:33:44:55:66"
#   - "00-E0-25-A9-90-3A"

# Web 管理后台入口，手动填写时长度必须为 4-64 位大小写字母。
# 首次启动保持为空，系统会自动生成 8 位字母入口。
# 例如生成 admin_path: "aBcDeFGh" 后，访问地址为 http://代理地址:14250/aBcDeFGh/。
admin_path: ""

# Web 管理令牌和 APK 使用的 key 相互独立，不写入本 YAML。
# 首次启动会自动生成令牌，配置文件旁的 config.yml.admin-token 受限 sidecar 只保存 PBKDF2 verifier，
# 并仅在本次启动的控制台输出一次；正常重启不会再次输出。
# 如需在下次启动时强制生成新令牌，可临时取消下面一行的注释：
# admin_token: ""
